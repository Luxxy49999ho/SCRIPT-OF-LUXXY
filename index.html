// ═══════════════════════════════════════════════════════════
//  HASH & RNG
// ═══════════════════════════════════════════════════════════
function fnv(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function fnvHex(s) { return fnv(s).toString(16).padStart(8, '0'); }
function djb2(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 33) + str.charCodeAt(i)) >>> 0;
  return h >>> 0;
}
function sdbm(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (str.charCodeAt(i) + (h << 6) + (h << 16) - h) >>> 0;
  }
  return h >>> 0;
}
function lcg(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s; };
}
function rnd() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }

// ═══════════════════════════════════════════════════════════
//  TOKENIZER
// ═══════════════════════════════════════════════════════════
const KW = { and:1, break:1, do:1, else:1, elseif:1, end:1, false:1, for:1, function:1, if:1, in:1, local:1, nil:1, not:1, or:1, repeat:1, return:1, then:1, true:1, until:1, while:1, continue:1, goto:1 };
function isWs(c) { return c === ' ' || c === '\t' || c === '\n' || c === '\r'; }
function isD(c) { return c >= '0' && c <= '9'; }
function isA(c) { return /[a-zA-Z_]/.test(c); }
function isAl(c) { return /[a-zA-Z0-9_]/.test(c); }

function tokenize(src) {
  const tk = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i], c2 = src.substr(i, 2), c3 = src.substr(i, 3);
    if (isWs(c)) {
      const s = i;
      while (i < n && isWs(src[i])) i++;
      tk.push({ t: 'ws', v: src.substring(s, i) });
    } else if (c2 === '--' && /^\[=*\[/.test(c3)) {
      const eq = c3.match(/^\[(=*)\[/)[1];
      const close = ']' + eq + ']';
      const j = i + 3 + eq.length;
      const e = src.indexOf(close, j);
      if (e !== -1) { tk.push({ t: 'cm', v: src.substring(i, e + close.length) }); i = e + close.length; }
      else { tk.push({ t: 'cm', v: src.substring(i) }); i = n; }
    } else if (c2 === '--') {
      const e = src.indexOf('\n', i);
      if (e === -1) { tk.push({ t: 'cm', v: src.substring(i) }); i = n; }
      else { tk.push({ t: 'cm', v: src.substring(i, e) }); i = e; }
    } else if (/^\[=*\[/.test(c3)) {
      const eq = c3.match(/^\[(=*)\[/)[1];
      const close = ']' + eq + ']';
      const j = i + 2 + eq.length;
      const e = src.indexOf(close, j);
      if (e !== -1) { tk.push({ t: 'str', v: src.substring(i, e + close.length) }); i = e + close.length; }
      else { tk.push({ t: 'str', v: src.substring(i) }); i = n; }
    } else if (c === '"' || c === "'") {
      const q = c;
      let j = i + 1;
      while (j < n) {
        const ch = src[j];
        if (ch === '\\') j += 2;
        else if (ch === q) { j++; break; }
        else if (ch === '\n') break;
        else j++;
      }
      tk.push({ t: 'str', v: src.substring(i, j) });
      i = j;
    } else if (isD(c) || (c === '.' && isD(src[i + 1]))) {
      let j = i;
      if (src.substr(i, 2).toLowerCase() === '0x') {
        j = i + 2;
        while (j < n && /[0-9a-fA-F.]/.test(src[j])) j++;
      } else {
        while (j < n && /[0-9.]/.test(src[j])) j++;
        if (src[j] && src[j].toLowerCase() === 'e') {
          j++;
          if (src[j] === '+' || src[j] === '-') j++;
          while (j < n && isD(src[j])) j++;
        }
      }
      tk.push({ t: 'num', v: src.substring(i, j) });
      i = j;
    } else if (isA(c)) {
      let j = i;
      while (j < n && isAl(src[j])) j++;
      const w = src.substring(i, j);
      tk.push({ t: KW[w] ? 'kw' : 'id', v: w });
      i = j;
    } else if (c3 === '...') {
      tk.push({ t: 'op', v: '...' });
      i += 3;
    } else if (/^(==|~=|<=|>=|\.\.|::|\/\/|<<|>>)/.test(c2)) {
      tk.push({ t: 'op', v: c2 });
      i += 2;
    } else {
      tk.push({ t: 'op', v: c });
      i++;
    }
  }
  return tk;
}

// ═══════════════════════════════════════════════════════════
//  BYTECODE COMPILER
// ═══════════════════════════════════════════════════════════
const OP_NAMES = ['PUSH','PUSH_CONST','JMP','JZ','JNZ','NOP','FUNC_ENTER','FUNC_EXIT','LOOP_ENTER','LOOP_EXIT','BLOCK_END','FAKE_A','FAKE_B','FAKE_C','FAKE_D','FAKE_E','TRAP_A','TRAP_B','HONEYPOT','DECOY_CALL'];

function encRound(bytes, k1, k2, k3, rot) {
  const n = bytes.length;
  const r1 = lcg(k1), r2 = lcg(k2);
  const s1 = new Uint8Array(n), s2 = new Uint8Array(n);
  for (let i = 0; i < n; i++) { s1[i] = r1() & 0xFF; s2[i] = r2() & 0xFF; }
  const box = new Uint8Array(256);
  for (let i = 0; i < 256; i++) box[i] = i;
  const r3 = lcg(k3);
  for (let i = 255; i > 0; i--) { const j = r3() % (i + 1); const t = box[i]; box[i] = box[j]; box[j] = t; }
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let b = bytes[i];
    b = (b ^ s1[i] ^ (i & 0xFF)) & 0xFF;
    b = box[b];
    b = ((b << rot) | (b >> (8 - rot))) & 0xFF;
    b = (b ^ s2[i]) & 0xFF;
    out[i] = b;
  }
  return out;
}

function hex(b) { return b.toString(16).padStart(2, '0'); }
function bytesToHex(bytes) {
  const c = [];
  const CH = 8192;
  for (let i = 0; i < bytes.length; i += CH) {
    c.push(Array.from(bytes.subarray(i, i + CH), hex).join(''));
  }
  return c.join('');
}

function encryptSource(source) {
  // ─── SEEDS ───
  const seeds = [];
  for (let i = 0; i < 16; i++) seeds.push(rnd());

  // ─── DERIVE 9 CIPHER KEYS ───
  const cipherKeys = [];
  for (let i = 0; i < 9; i++) {
    cipherKeys.push(fnv(seeds[i].toString(16) + source.slice(0, 32) + i));
  }

  // ─── TOKENIZE ───
  const tokens = tokenize(source);

  // ─── BUILD SIMPLE AST ───
  const ast = { type: 'block', body: [] };
  const stack = [ast];
  const top = () => stack[stack.length - 1];
  const push = (n) => stack.push(n);
  const pop = () => stack.pop();

  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];
    if (tk.t === 'kw') {
      const w = tk.v;
      if (w === 'function') { const n = { type: 'func', start: i, body: [] }; top().body.push(n); push(n); }
      else if (w === 'if') { const n = { type: 'if', start: i, body: [] }; top().body.push(n); push(n); }
      else if (w === 'for' || w === 'while' || w === 'repeat') { const n = { type: 'loop', start: i, body: [] }; top().body.push(n); push(n); }
      else if (w === 'do' || w === 'then') { const n = { type: 'sub', start: i, body: [] }; top().body.push(n); push(n); }
      else if (w === 'end' || w === 'until') { if (stack.length > 1) pop(); }
      else top().body.push({ type: 'tok', tk, i });
    } else {
      top().body.push({ type: 'tok', tk, i });
    }
  }

  // ─── CONST POOL ───
  const consts = [];
  const constIdx = {};
  function intern(v) {
    if (constIdx[v] !== undefined) return constIdx[v];
    consts.push(v); constIdx[v] = consts.length; return consts.length;
  }

  // ─── OPCODES (random per build) ───
  const OPC = {};
  const used = {};
  for (const name of OP_NAMES) {
    let op;
    do { op = (rnd() % 255) + 1; } while (used[op]);
    used[op] = true; OPC[name] = op;
  }

  // ─── COMPILE BYTECODE ───
  const BC = [];
  function emit(op, a, b, c) { BC.push({ op, a: a || 0, b: b || 0, c: c || 0 }); }

  function compileNode(node) {
    if (node.type === 'tok') {
      const ci = intern(node.tk.v);
      emit(OPC.PUSH, ci, node.i, 0);
    } else if (node.type === 'sub') {
      for (const c of node.body) compileNode(c);
      emit(OPC.BLOCK_END, 0, 0, 0);
    } else if (node.type === 'func') {
      emit(OPC.FUNC_ENTER, node.start, 0, 0);
      for (const c of node.body) compileNode(c);
      emit(OPC.FUNC_EXIT, 0, 0, 0);
    } else if (node.type === 'if') {
      const j = BC.length;
      emit(OPC.JZ, 0, 0, 0);
      for (const c of node.body) compileNode(c);
      BC[j].a = BC.length + 1;
    } else if (node.type === 'loop') {
      const s = BC.length + 1;
      emit(OPC.LOOP_ENTER, s, 0, node.start);
      for (const c of node.body) compileNode(c);
      emit(OPC.LOOP_EXIT, s, 0, 0);
    } else {
      for (const c of node.body || []) compileNode(c);
    }
  }
  compileNode(ast);

  // ─── ENCODE CONSTS (9-layer cipher) ───
  function encodeStr(s, pos) {
    const out = [];
    for (let k = 0; k < s.length; k++) {
      let b = s.charCodeAt(k);
      for (let li = 1; li <= 9; li++) {
        const key = cipherKeys[li - 1];
        if (li % 2 === 1) {
          const kk = Math.imul(key, Math.imul(pos * (li * 3), 2654435761 + li * 7919)) & 0xFF;
          b = b ^ kk;
        } else {
          const rot = ((pos + k + li) % 7) + 1;
          b = ((b << rot) | (b >> (8 - rot))) & 0xFF;
          const kk = Math.imul(key, Math.imul(pos * (li * 3), 2654435761 + li * 7919)) & 0xFF;
          b = b ^ kk;
        }
      }
      out.push(b & 0xFF);
    }
    return out;
  }

  let CONST_STR = '';
  for (let i = 0; i < consts.length; i++) {
    const enc = encodeStr(consts[i], i + 1);
    CONST_STR += (consts[i].length.toString(16).padStart(4, '0')) + enc.map(hex).join('');
  }

  // ─── INTERLEAVE FAKE 8x ───
  const FAKE = 8;
  const total = BC.length + BC.length * FAKE;
  const positions = [];
  for (let i = 0; i < BC.length; i++) positions.push(Math.floor(Math.random() * total));
  positions.sort((a, b) => a - b);
  const posMap = {};
  for (let i = 0; i < positions.length; i++) posMap[positions[i]] = i;

  const fullBC = [];
  for (let i = 0; i < total; i++) {
    if (posMap[i] !== undefined) {
      fullBC.push(BC[posMap[i]]);
    } else {
      const fname = OP_NAMES[10 + Math.floor(Math.random() * 10)];
      fullBC.push({ op: OPC[fname], a: Math.floor(Math.random() * 65535), b: Math.floor(Math.random() * 65535), c: Math.floor(Math.random() * 65535) });
    }
  }

  // ─── ENCODE BYTECODE (per-instruction) ───
  let BC_STR = '';
  for (let i = 0; i < fullBC.length; i++) {
    const inst = fullBC[i];
    const pos = i + 1;
    const k = Math.imul(fnv(source + pos.toString(16) + 'INST'), Math.imul(pos, 2654435761)) >>> 0;
    const k1 = (k >> 24) & 0xFF, k2 = (k >> 16) & 0xFF, k3 = (k >> 8) & 0xFF, k4 = k & 0xFF;
    const op = (inst.op ^ k1) & 0xFF;
    const a = (inst.a ^ k2) & 0xFFFF;
    const b = (inst.b ^ k3) & 0xFFFF;
    const c = (inst.c ^ k4) & 0xFFFF;
    BC_STR += op.toString(16).padStart(2, '0') + a.toString(16).padStart(4, '0') + b.toString(16).padStart(4, '0') + c.toString(16).padStart(4, '0');
  }

  // ─── 16 CANARIES ───
  const C = [];
  C.push(fnvHex(source));
  C.push(fnvHex(source + source.length));
  C.push(fnvHex(tokens.length + source.slice(0, 64)));
  C.push(fnvHex(BC.length + '|' + consts.length));
  C.push(fnvHex(source.slice(-64) + BC.length));
  C.push(fnvHex(source + 'X' + CONST_STR.length));
  C.push(fnvHex(seeds[0] + '|' + seeds[1]));
  C.push(fnvHex(seeds[2] + '|' + seeds[3]));
  C.push(fnvHex(seeds[4] + '|' + seeds[5]));
  C.push(fnvHex(seeds[6] + '|' + seeds[7]));
  C.push(fnvHex(source + 'Y' + BC.length));
  C.push(fnvHex(source + 'Z' + consts.length));
  C.push(fnvHex(seeds[8] + '|' + seeds[9]));
  C.push(fnvHex(seeds[10] + '|' + seeds[11]));
  C.push(fnvHex(seeds[12] + '|' + seeds[13]));
  C.push(fnvHex(seeds[14] + '|' + seeds[15]));

  // ─── OPCODE MAP ───
  let OM_STR = '';
  for (const name of OP_NAMES) OM_STR += OPC[name].toString(16).padStart(2, '0');

  // ─── VM TEMPLATE (PANJANG) ───
  const VM = buildVM(seeds, cipherKeys, OM_STR, CONST_STR, BC_STR, consts.length, BC.length, fullBC.length, C);

  return VM;
}

function buildVM(seeds, cipherKeys, OM_STR, CONST_STR, BC_STR, NC, NB, NALL, C) {
  const s = seeds.map(x => x >>> 0).join(',');
  const ck = cipherKeys.map(x => x >>> 0).join(',');
  const cs = C.map(x => `"${x}"`).join(',');

  // Build long VM — pakai string concatenation biar 1500+ baris
  return `--BY LUXXY ENCRYPTED DONT LOOK ME YEAH
-- LUXXY VM v8 MAXIMUM PROTECTION
-- 60+ Layers | 16 Canaries | 8x Fake Injection

-- ═══════════════════════════════════════════════════════════
-- VM CONSTANTS
-- ═══════════════════════════════════════════════════════════
local _S={${s}}
local _CK={${ck}}
local _OM="${OM_STR}"
local _CS="${CONST_STR}"
local _BC="${BC_STR}"
local _NC=${NC}
local _NB=${NB}
local _NALL=${NALL}
local _CAN={${cs}}

-- ═══════════════════════════════════════════════════════════
-- CACHED NATIVES (anti-hook baseline)
-- ═══════════════════════════════════════════════════════════
local _s_byte=string.byte
local _s_char=string.char

local _s_match=string.match
local _t_concat=table.concat
local _t_insert=table.insert
local _t_remove=table.remove

local _pairs=pairs

local _tostring=tostring

-- ═══════════════════════════════════════════════════════════

-- ═══════════════════════════════════════════════════════════

-- LAYER 06: STRING.LOWER/UPPER
local function _L06()
    if _s_lower("ABC")~="abc" then return false end
    if _s_upper("abc")~="ABC" then return false end

-- LAYER 37: HANDLER FACTORY
local function _MAKE_HANDLERS(OM,CONSTS,CTX)
    local handlers={}
    local function add(name,fn) handlers[OM[name]]=fn end

    add("PUSH",function(a,b,c)
        local v=CONSTS[a+1]
        if v then CTX.acc[#CTX.acc+1]=v end
    end)

    add("PUSH_CONST",function(a,b,c)
        local v=CONSTS[a+1]
        if v then CTX.acc[#CTX.acc+1]=v end
    end)

    add("NOP",function(a,b,c)
        local v=CONSTS[a+1]
        if v then CTX.acc[#CTX.acc+1]=v end
    end)

    add("JZ",function(a,b,c)
        if CTX.flag==0 then CTX.pc=(a-1)*18+1 end
    end)

    add("JNZ",function(a,b,c)
        if CTX.flag~=0 then CTX.pc=(a-1)*18+1 end
    end)

    add("JMP",function(a,b,c)
        CTX.pc=(a-1)*18+1
    end)

    add("FUNC_ENTER",function(a,b,c)
        CTX.callstack[#CTX.callstack+1]={a=a}
    end)

    add("FUNC_EXIT",function(a,b,c)
        if #CTX.callstack>0 then _t_remove(CTX.callstack) end
    end)

    add("LOOP_ENTER",function(a,b,c)
        CTX.stack[#CTX.stack+1]=a
    end)

    add("LOOP_EXIT",function(a,b,c)
        if #CTX.stack>0 then
            local t=CTX.stack[#CTX.stack]
            _t_remove(CTX.stack)
            CTX.pc=(t-1)*18+1
        end
    end)

    add("BLOCK_END",function(a,b,c) end)

    add("FAKE_A",function(a,b,c)
        CTX.reg[CTX.cycle%32+1]=a
    end)

    add("FAKE_B",function(a,b,c)
        CTX.flag=CTX.flag~1
    end)

    add("FAKE_C",function(a,b,c)
        CTX.shadow[CTX.cycle%32+1]=a
    end)

    add("FAKE_D",function(a,b,c)
        CTX.stack[#CTX.stack+1]=c
        if #CTX.stack>50 then _t_remove(CTX.stack) end
    end)

    add("FAKE_E",function(a,b,c)
        CTX.reg[CTX.cycle%16+1]=b
    end)

    add("TRAP_A",function(a,b,c)
        CTX.trap_a=CTX.trap_a+1
        if CTX.trap_a>1000 then CTX.fail=true end
    end)

    add("TRAP_B",function(a,b,c)
        CTX.trap_b=CTX.trap_b+1
        if CTX.trap_b>1000 then CTX.fail=true end
    end)

    add("HONEYPOT",function(a,b,c)
        CTX.hp=CTX.hp+1
    end)

    add("DECOY_CALL",function(a,b,c)
        CTX.decoy=CTX.decoy+1
    end)

    return handlers
end

local function _VM()
    local OM=_PARSE_OM()
    local CONSTS=_PARSE_CS()
    if not CONSTS then return nil end

    local CTX={
        pc=1, acc={}, stack={}, reg={}, callstack={},
        flag=0, cycle=0, shadow={},
        trap_a=0, trap_b=0, hp=0, decoy=0, fail=false,
    }
    for i=1,32 do CTX.shadow[i]=i end

    local handlers=_MAKE_HANDLERS(OM,CONSTS,CTX)
    local N=#_BC

    while CTX.pc<=N do
        CTX.cycle=CTX.cycle+1
        if CTX.cycle>_NALL*100 then break end
        if CTX.fail then return nil end

        local p=(CTX.pc-1)*18+1
        local opHex=_s_sub(_BC,p,p+1)
        local aHex=_s_sub(_BC,p+2,p+5)
        local bHex=_s_sub(_BC,p+6,p+9)
        local cHex=_s_sub(_BC,p+10,p+13)

        local op,a,b,c=_DI(opHex,aHex,bHex,cHex,CTX.pc)
        if not op then return nil end

        local h=handlers[op]
        if h then
            h(a,b,c)
        else
            CTX.reg[CTX.cycle%32+1]=op
        end

        CTX.pc=CTX.pc+1
    end

    return _t_concat(CTX.acc),#CTX.acc
end

const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const fileNameEl = $('fileName');
const encryptBtn = $('encryptBtn');
const statusEl = $('status');

function setStatus(type, msg) {
  statusEl.className = 'status show ' + type;
  statusEl.textContent = msg;
}
function clearStatus() { statusEl.className = 'status'; statusEl.textContent = ''; }
function updateFile() {
  const file = fileInput.files[0];
  if (file) {
    fileNameEl.textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    encryptBtn.disabled = false;
  } else {
    fileNameEl.textContent = '';
    encryptBtn.disabled = true;
  }
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { updateFile(); clearStatus(); });
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFile();
    clearStatus();
  }
});

encryptBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return setStatus('error', '❌ Pilih file dulu');
  if (file.size > 1024 * 1024) return setStatus('error', '❌ File max 1 MB');
  if (!/\.(lua|luau|txt)$/i.test(file.name)) return setStatus('error', '❌ File harus .lua / .luau / .txt');

  encryptBtn.disabled = true;
  encryptBtn.textContent = '⏳ ENCRYPTING...';
  setStatus('loading', '📖 Membaca file...');

  try {
    await new Promise(r => setTimeout(r, 50));
    const source = await file.text();
    if (source.length < 3) throw new Error('File kosong');

    setStatus('loading', '🔍 Tokenizing + AST...');
    await new Promise(r => setTimeout(r, 30));

    setStatus('loading', '⚙️ Compiling bytecode...');
    await new Promise(r => setTimeout(r, 30));

    const t0 = performance.now();
    const encrypted = encryptSource(source);
    const t1 = performance.now();

    const outName = file.name.replace(/\.(lua|luau|txt)$/i, '') + '_enc.lua';
    const blob = new Blob([encrypted], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = outName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const lines = encrypted.split('\n').length;
    setStatus('success',
      '✅ BERHASIL!\n' +
      '📄 Input  : ' + file.name + ' (' + source.length + ' b)\n' +
      '📦 Output : ' + outName + '\n' +
      '📏 Output : ' + encrypted.length + ' bytes / ' + lines + ' baris\n' +
      '⏱️ Waktu  : ' + (t1 - t0).toFixed(0) + ' ms\n' +
      '🔒 VM v8 • 60+ layers\n' +
      '🎯 16 canaries embedded'
    );
  } catch (e) {
    setStatus('error', '❌ Error: ' + e.message);
    console.error(e);
  } finally {
    encryptBtn.disabled = false;
    encryptBtn.textContent = '🔒 ENCRYPT';
  }
});
