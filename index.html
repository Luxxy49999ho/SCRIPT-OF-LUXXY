function fnvBytes(bytes) {
  let h = 2166136261;
  for (let i = 0; i < bytes.length; i++) {
    h ^= bytes[i];
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function hex8(n) { return (n >>> 0).toString(16).padStart(8, '0'); }
function strToBytes(s) { return new TextEncoder().encode(s); }
function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0); out.set(b, a.length); return out;
}
function lcg(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s; };
}
function makeSBox(seed) {
  const box = new Uint8Array(256);
  for (let i = 0; i < 256; i++) box[i] = i;
  const r = lcg(seed);
  for (let i = 255; i > 0; i--) {
    const j = r() % (i + 1);
    const t = box[i]; box[i] = box[j]; box[j] = t;
  }
  return box;
}
function genKS(seed, n) {
  const r = lcg(seed);
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = r() & 0xFF;
  return out;
}
function encRound(bytes, k1, k2, k3, rot) {
  const n = bytes.length;
  const s1 = genKS(k1, n);
  const s2 = genKS(k2, n);
  const sb = makeSBox(k3);
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let b = bytes[i];
    b = (b ^ s1[i] ^ (i & 0xFF)) & 0xFF;
    b = sb[b];
    b = ((b << rot) | (b >> (8 - rot))) & 0xFF;
    b = (b ^ s2[i]) & 0xFF;
    out[i] = b;
  }
  return out;
}
function toHex(bytes) {
  const out = [];
  for (let i = 0; i < bytes.length; i++) out.push(bytes[i].toString(16).padStart(2, '0'));
  return out.join('');
}
function randSeed() {

//  UI

const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const fileNameEl = $('fileName');
const encryptBtn = $('encryptBtn');
const statusEl = $('status');

function setStatus(type, msg) {
  statusEl.className = 'status show ' + type;
  statusEl.textContent = msg;
}
function clearStatus() { statusEl.className = 'status'; statusEl.textContent = ''; }
function updateFile() {
  const file = fileInput.files[0];
  if (file) {
    fileNameEl.textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    encryptBtn.disabled = false;
  } else {
    fileNameEl.textContent = '';
    encryptBtn.disabled = true;
  }
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { updateFile(); clearStatus(); });
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFile();
    clearStatus();
  }
});

encryptBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return setStatus('error', '❌ Pilih file dulu');
  if (file.size > 1024 * 1024) return setStatus('error', '❌ File max 1 MB');
  if (!/\.(lua|luau|txt)$/i.test(file.name)) return setStatus('error', '❌ File harus .lua / .luau / .txt');

  encryptBtn.disabled = true;
  encryptBtn.textContent = '⏳ ENCRYPTING...';
  setStatus('loading', '📖 Membaca file...');

  try {
    await new Promise(r => setTimeout(r, 30));
    const source = await file.text();
    if (source.length < 3) throw new Error('File kosong');

    setStatus('loading', '🔐 Encrypting ' + source.length + ' bytes...');
    await new Promise(r => setTimeout(r, 30));

    const t0 = performance.now();
    const encrypted = encryptSource(source);
    const t1 = performance.now();

    const outName = file.name.replace(/\.(lua|luau|txt)$/i, '') + '_enc.lua';
    const blob = new Blob([encrypted], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = outName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const lines = encrypted.split('\n').length;
    setStatus('success',
      '✅ BERHASIL!\n' +
      '📄 Input  : ' + file.name + ' (' + source.length + ' b)\n' +
      '📦 Output : ' + outName + '\n' +
      '📏 Size   : ' + encrypted.length + ' b / ' + lines + ' baris\n' +
      '⏱️ Waktu  : ' + (t1 - t0).toFixed(0) + ' ms\n' +
      '🔑 No _K • Keys hidden in _D\n' +
      '🎯 20 checks + 10 opaque + 8 canaries'
    );
  } catch (e) {
    setStatus('error', '❌ Error: ' + e.message);
    console.error(e);
  } finally {
    encryptBtn.disabled = false;
    encryptBtn.textContent = '🔒 ENCRYPT';
  }
});
