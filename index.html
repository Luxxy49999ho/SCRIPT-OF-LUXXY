// ═══════════════════════════════════════════════════════════
//  CRYPTO CORE
// ═══════════════════════════════════════════════════════════
function fnvBytes(bytes) {
  let h = 2166136261;
  for (let i = 0; i < bytes.length; i++) {
    h ^= bytes[i];
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function fnvStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i) & 0xFF;
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function hex8(n) { return (n >>> 0).toString(16).padStart(8, '0'); }

function lcg(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s; };
}

function makeSBox(seed) {
  const box = new Uint8Array(256);
  for (let i = 0; i < 256; i++) box[i] = i;
  const r = lcg(seed);
  for (let i = 255; i > 0; i--) {
    const j = r() % (i + 1);
    const t = box[i]; box[i] = box[j]; box[j] = t;
  }
  return box;
}

function genKS(seed, n) {
  const r = lcg(seed);
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = r() & 0xFF;
  return out;
}

function encRound(bytes, k1, k2, k3, rot) {
  const n = bytes.length;
  const s1 = genKS(k1, n);
  const s2 = genKS(k2, n);
  const sb = makeSBox(k3);
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let b = bytes[i];
    b = (b ^ s1[i] ^ (i & 0xFF)) & 0xFF;
    b = sb[b];
    b = ((b << rot) | (b >> (8 - rot))) & 0xFF;
    b = (b ^ s2[i]) & 0xFF;
    out[i] = b;
  }
  return out;
}

function toHex(bytes) {
  const out = [];
  for (let i = 0; i < bytes.length; i++) out.push(bytes[i].toString(16).padStart(2, '0'));
  return out.join('');
}

function randSeed() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0];
}

function encryptSource(source) {

  for (let i = 0; i < 12; i++) {

    keys.push(fnvStr(seed.toString(16) + srcHashHex + i.toString()));

  d = encRound(d, keys[3],  keys[4],  keys[5],  5);
  d = encRound(d, keys[6],  keys[7],  keys[8],  7);
  d = encRound(d, keys[9],  keys[10], keys[11], 1);

  const hexStr = toHex(d);
  const keyHex = keys.map(k => hex8(k)).join('');

  // 8 canaries (dari source bytes)

  const c7 = hex8((fnvBytes(srcBytes) << 1) >>> 0);
  const c8 = hex8((fnvBytes(srcBytes) ^ 0xA5A5A5A5) >>> 0);

  // Build Lua loader (PANJANG)
  return buildLoader(keyHex, hexStr, [c1, c2, c3, c4, c5, c6, c7, c8]);
}

    );
  } catch (e) {
    setStatus('error', '❌ Error: ' + e.message);
    console.error(e);
  } finally {
    encryptBtn.disabled = false;
    encryptBtn.textContent = '🔒 ENCRYPT';
  }
});
</script>
</body>
